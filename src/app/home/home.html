<!-- Header -->
<header class="bg-transparent backdrop-blur-sm fixed top-0 left-0 right-0 z-50">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <div class="text-2xl font-bold text-green-600 drop-shadow-lg">SnapFood</div>
    <nav class="space-x-6 flex justify-center items-center">
      <a
        routerLink="/"
        class="text-white hover:text-green-400 transition duration-300 drop-shadow-lg"
        >Accueil</a
      >
      <a
        routerLink="/categories"
        class="text-white hover:text-green-400 transition duration-300 drop-shadow-lg"
        >Catégories</a
      >
      <a
        routerLink="/produits"
        class="text-white hover:text-green-400 transition duration-300 drop-shadow-lg"
        >Produits</a
      >
      <a
        routerLink="/connexion"
        class="text-white hover:text-green-400 transition duration-300 drop-shadow-lg"
        >Se connecter</a
      >
    </nav>
  </div>
</header>

<!-- Hero Section avec vidéo bannière -->
<section class="relative h-screen flex items-center justify-center overflow-hidden pt-16">
  <video
    #video
    muted
    loop
    autoplay
    playsinline
    preload="metadata"
    class="absolute inset-0 w-full h-full object-cover"
  >
    <source src="/assets/video/banniere.mp4" type="video/mp4" />
    Votre navigateur ne supporte pas la vidéo.
  </video>
  <div class="absolute inset-0 bg-black bg-opacity-50"></div>
  <div class="relative z-10 text-center text-white px-4">
    <h1 class="text-4xl md:text-6xl font-bold mb-4">Bienvenue chez SnapFood</h1>
    <p class="text-xl md:text-2xl mb-8">
      Découvrez les meilleurs produits alimentaires frais du Sénégal
    </p>
    <button
      (click)="orderOnWhatsApp('des produits')"
      class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition duration-300"
    >
      Commander maintenant
    </button>
  </div>
</section>

<!-- Footer -->
<footer class="bg-green-100 text-gray-800 py-8">
  <div class="container mx-auto px-4 text-center">
    <h3 class="text-xl font-bold mb-4 text-green-600">SnapFood</h3>
    <p class="mb-4">Les meilleurs produits alimentaires frais du Sénégal</p>
    <div class="flex justify-center space-x-6">
      <a routerLink="/" class="hover:text-green-600 transition duration-300">Accueil</a>
      <a routerLink="/produits" class="hover:text-green-600 transition duration-300">Produits</a>
      <a routerLink="/contact" class="hover:text-green-600 transition duration-300">Contact</a>
    </div>
  </div>
</footer>

<!-- Nouveau pied de page -->
<footer class="bg-green-600 text-white py-4">
  <div class="container mx-auto text-center">
    <p>&copy; 2025 SnapFood. Tous droits réservés.</p>
  </div>
</footer>
