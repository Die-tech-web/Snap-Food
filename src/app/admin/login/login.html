<div class="max-w-md mx-auto mt-12 bg-white p-6 rounded-lg shadow">
  <h2 class="text-2xl font-semibold mb-4">Admin Login</h2>

  <form (ngSubmit)="submit()" [formGroup]="form" novalidate>
    <div class="mb-3">
      <label class="block text-sm font-medium">Email</label>
      <input formControlName="email" type="email" class="w-full border rounded px-3 py-2" />
    </div>

    <div class="mb-3">
      <label class="block text-sm font-medium">Mot de passe</label>
      <input formControlName="password" type="password" class="w-full border rounded px-3 py-2" />
    </div>

    <div *ngIf="errorMessage" class="text-red-600 mb-3">{{ errorMessage }}</div>

    <div class="flex justify-end">
      <a
        routerLink="/"
        class="mr-3 px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50"
        >Retour</a
      >
      <button class="bg-snapfood text-white px-4 py-2 rounded" type="submit">Se connecter</button>
    </div>
  </form>
</div>
